line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "B", "A", "BLE"]
# B904: `raise ... from` inside except is enforced case by case with noqa.
ignore = []

[lint.per-file-ignores]
# Parser fixtures are execute() bodies: `self` is bound by the caller.
"**/tests/fixtures/parser/*/expected.py" = ["F821"]
