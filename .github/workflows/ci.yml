name: CI
on:
  push:
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install ".[dev]"
      - run: PYTHONPATH=src pytest tests/ -v

  demos:
    needs: pytest
    runs-on: ubuntu-latest
    env:
      # Demos using the shared genesispy.mk (have gen + pylint + vlint).
      # regfile waives its one WIDTHEXPAND warning via VERILATOR_FLAGS in
      # its own Makefile (the zero-extension is intended).
      MK_DEMOS: >-
        demos/iterative_wallace_tree
        demos/many_iterative_wallace_trees
        demos/random_logic
        demos/regfile
        demos/include_examples
        demos/pyinclude_examples
      # Own Makefile, so gen + vlint but no pylint target.
      GEN_VLINT_DEMOS: demos/generation_examples
      GVPY_DEMO: demos/gvpy
      # Own Makefile and build layout (build/<top>/default/), gen + pylint +
      # vlint. Its `make test` sweeps ~124 simulator configurations and is not
      # run here.
      DSP_DEMO: demos/dsp
      VLINT_DEMOS: >-
        demos/iterative_wallace_tree
        demos/many_iterative_wallace_trees
        demos/random_logic
        demos/regfile
        demos/include_examples
        demos/pyinclude_examples
        demos/generation_examples
        demos/gvpy
        demos/dsp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - name: Install verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: make gen (all demos)
        run: |
          set -e
          for d in $MK_DEMOS $GEN_VLINT_DEMOS $GVPY_DEMO $DSP_DEMO; do
            echo "=== gen: $d ==="
            make -C "$d" gen
          done
      - name: make pylint (demos with a pylint target)
        run: |
          set -e
          for d in $MK_DEMOS $DSP_DEMO; do
            echo "=== pylint: $d ==="
            make -C "$d" pylint
          done
      - name: make vlint VERILINT=verilator
        run: |
          set -e
          for d in $VLINT_DEMOS; do
            echo "=== vlint: $d ==="
            make -C "$d" vlint VERILINT=verilator
          done
