name: CI
on:
  push:
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install ".[dev]"
      - run: PYTHONPATH=src pytest tests/ -v

  demos:
    needs: pytest
    runs-on: ubuntu-latest
    env:
      # Demos using the shared genesispy.mk (have pylint + vlint targets).
      # regfile excluded: WIDTHEXPAND warning at reg_file.vpy:213 (inherited
      # from upstream Genesis2 demo, not a porting bug).
      MK_DEMOS: >-
        demos/iterative_wallace_tree
        demos/many_iterative_wallace_trees
        demos/random_logic
      GVPY_DEMO: demos/gvpy
      VLINT_DEMOS: >-
        demos/iterative_wallace_tree
        demos/many_iterative_wallace_trees
        demos/random_logic
        demos/gvpy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - name: Install verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: make gen (all demos)
        run: |
          set -e
          for d in $MK_DEMOS $GVPY_DEMO; do
            echo "=== gen: $d ==="
            make -C "$d" gen
          done
      - name: make pylint (genesispy.mk demos)
        run: |
          set -e
          for d in $MK_DEMOS; do
            echo "=== pylint: $d ==="
            make -C "$d" pylint
          done
      - name: make vlint VERILINT=verilator
        run: |
          set -e
          for d in $VLINT_DEMOS; do
            echo "=== vlint: $d ==="
            make -C "$d" vlint VERILINT=verilator
          done
